version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: traffic_postgres_db
    environment:
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: traffic_secure_pass_2026
      POSTGRES_DB: traffic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_user -d traffic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traffic_fastapi_backend
    environment:
      DATABASE_URL: postgresql://traffic_user:traffic_secure_pass_2026@db:5432/traffic_db
      JWT_SECRET: super-secret-smart-traffic-jwt-key-2026
    ports:
      - "8000:8000"
    volumes:
      - ./evidence_snapshots:/app/evidence_snapshots
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traffic_command_ui
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
